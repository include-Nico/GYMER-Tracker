<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GYMER Tracker</title>
<meta name="theme-color" content="#07070d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYMER">
<style>
:root{--bg:#07070d;--tx:#f5f5fa;--mu:#9d9db8;--ac:#8b7bff;--ac2:#27d7ff;--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--gbd:rgba(255,255,255,.22);--hi:rgba(255,255,255,.45);--sh:rgba(0,0,0,.35);--sheet:rgba(22,20,40,.82);--o:.55;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=light]{--bg:#eceefd;--tx:#14142b;--mu:#5f5f7e;--ac:#6a4dff;--ac2:#0aa5d6;--g1:rgba(255,255,255,.85);--g2:rgba(255,255,255,.35);--gbd:rgba(255,255,255,.95);--hi:#fff;--sh:rgba(80,70,160,.22);--sheet:rgba(244,245,255,.88);--o:.45;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--o);animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:60vmax;height:60vmax;background:var(--ac);top:-20%;left:-20%}
.bg i:nth-child(2){width:50vmax;height:50vmax;background:var(--ac2);bottom:-15%;right:-20%;animation-delay:-6s}
.bg i:nth-child(3){width:35vmax;height:35vmax;background:#ff5fa2;top:40%;left:35%;opacity:calc(var(--o)*.6);animation-delay:-11s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#main{max-width:560px;margin:0 auto;padding:14px 16px calc(120px + env(safe-area-inset-bottom,0px));animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.g,.gb{position:relative;border:1px solid var(--gbd);background:linear-gradient(145deg,var(--g1),var(--g2));backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 1px 1px var(--hi),inset 0 -10px 18px -10px rgba(255,255,255,.12),0 10px 28px var(--sh)}
.g::before,.gb::before{content:"";position:absolute;inset:0 0 55% 0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.28),transparent);opacity:.45;pointer-events:none}
.g{border-radius:26px}
.gb{font:inherit;color:var(--tx);cursor:pointer;border-radius:18px;padding:11px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;transition:transform .18s cubic-bezier(.3,1.5,.5,1),filter .2s}
.gb:active{transform:scale(.92);filter:brightness(1.25)}
.gb.on{background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 70%,transparent),color-mix(in srgb,var(--ac2) 45%,transparent));border-color:rgba(255,255,255,.45);color:#fff}
.rd{border-radius:50%;width:56px;height:56px;padding:0}
.sm{padding:8px;width:38px;height:38px;border-radius:13px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 16px;display:flex;align-items:center;gap:10px}
h1 span{flex:1}
h2{font-size:12px;color:var(--mu);margin:22px 4px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:16px;cursor:pointer;transition:transform .18s}.card:active{transform:scale(.96)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.mu{color:var(--mu);font-size:13px}
.badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
.item{padding:14px;margin-bottom:10px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--g2);border:1px solid var(--gbd);border-radius:14px;padding:11px;outline:none;text-align:center}
textarea{text-align:left}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:5px;text-align:center}
.step{display:flex;gap:6px;align-items:center}.step input{font-size:20px;font-weight:700}
.f3{display:grid;grid-template-columns:.7fr 1.2fr 1.4fr;gap:10px;margin-bottom:14px}
#nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;display:flex;padding:6px;z-index:10;border-radius:28px}
#nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:22px;cursor:pointer;transition:all .25s}
#nav button.on{color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 75%,transparent),color-mix(in srgb,var(--ac2) 50%,transparent));box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:9;padding:6px 8px 6px 16px;border-radius:30px;display:none;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.rg{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:8px auto 22px}
.rg svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ac) 55%,transparent))}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font-size:clamp(46px,14vw,64px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin-bottom:26px}
.big{width:88px;height:88px;border-radius:50%;padding:0}.big .ic{width:36px;height:36px}
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.pr .gb{flex-direction:column;gap:2px;padding:14px 6px;font-size:17px}.pr small{font-size:11px;font-weight:500;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;background:var(--sheet);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--gbd);animation:up .35s cubic-bezier(.2,.9,.2,1)}
.sheet h3{margin:0 0 14px;text-align:center}
.wl{display:flex;justify-content:center;gap:6px;position:relative;height:176px;margin-bottom:16px}
.wl::before{content:"";position:absolute;left:12%;right:12%;top:66px;height:44px;border-radius:12px;background:var(--g1);border:1px solid var(--gbd)}
.wh{width:96px;height:176px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:66px 0;position:relative;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wh::-webkit-scrollbar{display:none}
.wh div{height:44px;line-height:44px;text-align:center;font-size:26px;font-weight:700;scroll-snap-align:center;font-variant-numeric:tabular-nums}
.wu{align-self:center;font-size:14px;font-weight:600;color:var(--mu);width:34px;z-index:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.chips .gb{white-space:nowrap;padding:9px 14px;font-size:14px}
.seg{display:flex;gap:8px}.seg .gb{flex:1}
.flash{animation:pu .7s 3}@keyframes pu{50%{transform:scale(1.04)}}
.ex{text-align:center;padding:36px 10px;color:var(--mu)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fl{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.nr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nr label{margin:0;text-align:left;font-size:15px;font-weight:600;color:var(--tx)}
.nr .step{width:min(220px,64%);flex:none}
.nr .step input{min-width:0;padding:10px 2px;font-size:22px;font-weight:700}
.sw8{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--gbd);cursor:pointer;padding:0;box-shadow:inset 0 1px 2px rgba(255,255,255,.55);transition:transform .2s}
.sw.sel{transform:scale(1.15);outline:3px solid var(--tx);outline-offset:2px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:20px;font-weight:600;white-space:nowrap;animation:fade .3s}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></symbol>
<symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M19 6l1.5-1.5"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.8" height="14" rx="1.3" fill="currentColor"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.3" fill="currentColor"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3L3.5 8.5M3.5 3.5v5h5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-4-4L4 16zM14 6l4 4"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5h10L18 7M9 7V4h6v3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4 3.5-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></symbol>
<symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.6-2-.5-1.2.3-2.5 1.7-2.5H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
</defs></svg>
<div id="main"></div>
<div id="mini" class="g"></div>
<nav id="nav" class="g"></nav>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const I=(n,c="")=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const SEED={Petto:["Panca piana","Croci ai cavi"],Schiena:["Lat machine","Rematore"],Gambe:["Squat","Leg press"],Spalle:["Military press","Alzate laterali"],Bicipiti:["Curl manubri"],Tricipiti:["Push down"]};
let db=null;try{db=JSON.parse(localStorage.getItem("gymer"))}catch(e){}
db=db||{groups:Object.keys(SEED).map(n=>({id:uid(),name:n,ex:SEED[n].map(x=>({id:uid(),name:x,logs:[]}))}))};
db.theme=db.theme||"dark";db.metric=db.metric||"k";if(!db.timers||db.timers.length!==3)db.timers=[60,90,180];
db.prof=db.prof||{h:0,w:[]};
const save=()=>{try{localStorage.setItem("gymer",JSON.stringify(db))}catch(e){}};
let tab="train",V={},PE=null,EM=0;
const G=()=>db.groups.find(g=>g.id===V.g),E=()=>G()&&G().ex.find(e=>e.id===V.e);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=t=>new Date(t).toLocaleDateString("it-IT",{day:"2-digit",month:"short"});
const fmt=s=>{const c=Math.ceil(s);return Math.floor(c/60)+":"+String(c%60).padStart(2,"0")};
const lbl=s=>s<60?s+" s":s%60?Math.floor(s/60)+" min "+s%60+"s":s/60+" min";
const PAL=["#8b7bff","#27d7ff","#ff5fa2","#34d399","#fbbf24","#fb7185","#60a5fa","#f97316"],ACC=[["#8b7bff","#27d7ff"],["#ff5fa2","#fbbf24"],["#34d399","#27d7ff"],["#f97316","#fb7185"],["#60a5fa","#8b7bff"]];
const grad=c=>`linear-gradient(135deg,${c},color-mix(in srgb,${c} 55%,#000))`,gcol=(g,i)=>g.c||PAL[i%PAL.length];
const bwv=()=>{const w=db.prof.w;return w.length?w[w.length-1].v:0};
function toast(m){const t=document.createElement("div");t.className="toast g";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function del(msg,fn){const snap=JSON.stringify(db);fn();save();render(true);const old=$(".toast");if(old)old.remove();
 const t=document.createElement("div");t.className="toast g";t.style.cssText="display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px";
 t.innerHTML=`<span>${msg}</span><button class="gb" style="padding:8px 14px;border-radius:14px;color:var(--ac2)">Annulla</button>`;
 t.querySelector("button").onclick=()=>{db=JSON.parse(snap);save();render(true);t.remove()};
 document.body.appendChild(t);setTimeout(()=>t.remove(),6000)}
function ask(msg,ok){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet"><h3>${msg}</h3><div class="seg"><button class="gb" data-x>Annulla</button><button class="gb on" data-ok style="background:linear-gradient(145deg,#ff5b6e,#ff8a5b)">Conferma</button></div></div>`;o.onclick=e=>{const b=e.target.closest("button");if(e.target===o||(b&&b.dataset.x!==undefined))o.remove();else if(b&&b.dataset.ok!==undefined){o.remove();ok()}};document.body.appendChild(o)}
function gsheet(g){let col=g?gcol(g,db.groups.indexOf(g)):PAL[db.groups.length%PAL.length];const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="sheet"><h3>${g?"Modifica gruppo":"Nuovo gruppo"}</h3><input id="sf" placeholder="Nome gruppo" value="${esc(g?g.name:"")}" style="margin-bottom:16px"><div class="mu" style="text-align:center;margin-bottom:10px">Colore icona</div><div class="sw8">${PAL.map(c=>`<button class="sw ${c===col?"sel":""}" data-c="${c}" style="background:${grad(c)}"></button>`).join("")}</div><div class="seg"><button class="gb" data-x>Annulla</button>${g?`<button class="gb" data-del>${I("trash")}</button>`:""}<button class="gb on" data-ok>Salva</button></div></div>`;
 o.onclick=e=>{const b=e.target.closest("button");if(e.target===o||(b&&b.dataset.x!==undefined)){o.remove();return}if(!b)return;
  if(b.dataset.c){col=b.dataset.c;o.querySelectorAll(".sw").forEach(x=>x.classList.toggle("sel",x===b));return}
  if(b.dataset.del!==undefined){o.remove();del("Gruppo eliminato",()=>{db.groups=db.groups.filter(x=>x!==g);V={}});return}
  if(b.dataset.ok!==undefined){const n=$("#sf").value.trim();if(!n)return;if(g){g.name=n;g.c=col}else db.groups.push({id:uid(),name:n,c:col,ex:[]});save();o.remove();render()}};
 document.body.appendChild(o)}
function last(e){const l=e.logs||[];if(!l.length)return null;const k=new Date(l[l.length-1].d).toDateString(),s=l.filter(x=>new Date(x.d).toDateString()===k);return{d:l[l.length-1].d,s}}
/* ---------- TIMER ---------- */
const T={total:db.timers[0],left:db.timers[0],end:0,run:false,iv:null},R=104,C=2*Math.PI*R;
const rem=()=>T.run?Math.max(0,(T.end-Date.now())/1000):T.left;
function resume(){if(T.left<=0)T.left=T.total;T.end=Date.now()+T.left*1000;T.run=true;clearInterval(T.iv);T.iv=setInterval(tick,200);sync()}
function pause(){T.left=rem();T.run=false;clearInterval(T.iv);sync()}
function reset(){T.run=false;clearInterval(T.iv);T.left=T.total;sync()}
function start(s){T.total=s;T.left=s;resume()}
function addT(s){if(!T.run&&T.left<=0||T.total===0){start(s);return}if(T.run)T.end+=s*1000;else T.left+=s;T.total+=s;sync()}
function tick(){const r=rem();if(r<=0){done();return}paint(r)}
function paint(r){const c=$("#rc"),t=$("#rt"),m=$("#mt");if(c)c.style.strokeDashoffset=C*(1-(T.total?r/T.total:0));if(t)t.textContent=fmt(r);if(m)m.textContent=fmt(r)}
function sync(){mini();if(tab==="timer")render(true);else paint(rem())}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.35,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.25);o.start(a.currentTime+t);o.stop(a.currentTime+t+.26)})}catch(e){}}
function done(){T.run=false;T.left=0;clearInterval(T.iv);beep();try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}
 try{if("Notification"in window&&Notification.permission==="granted"){const c=navigator.serviceWorker&&navigator.serviceWorker.controller;c?c.postMessage({type:"TIMER_DONE"}):new Notification("GYMER",{body:"Recupero finito: tocca a te!"})}}catch(e){}sync()}
function mini(){const m=$("#mini"),show=tab!=="timer"&&(T.run||(T.left>0&&T.left<T.total));m.style.display=show?"flex":"none";
 if(show)m.innerHTML=`${I("clock")}<span id="mt">${fmt(rem())}</span><button class="gb rd sm" data-a="${T.run?"pause":"play"}">${I(T.run?"pause":"play")}</button>`}
/* ---------- WHEEL PICKER ---------- */
function wheel(id,max,step,v){let h="";for(let i=0;i<=max;i+=step)h+=`<div>${String(i).padStart(2,"0")}</div>`;return`<div class="wh" id="${id}" data-v="${v}">${h}</div>`}
function picker(title,sec,ok){
 const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="sheet"><h3>${title}</h3><div class="wl">${wheel("wm",59,1,Math.floor(sec/60))}<span class="wu">min</span>${wheel("ws",55,5,Math.round(sec%60/5))}<span class="wu">sec</span></div><div class="seg"><button class="gb" data-x>Annulla</button><button class="gb on" data-ok>Conferma</button></div></div>`;
 o.onclick=e=>{const b=e.target.closest("button");if(e.target===o||(b&&b.dataset.x!==undefined))o.remove();else if(b&&b.dataset.ok!==undefined){const m=Math.round($("#wm").scrollTop/44),s=Math.round($("#ws").scrollTop/44)*5;if(m*60+s>0){ok(m*60+s);o.remove()}}};
 document.body.appendChild(o);o.querySelectorAll(".wh").forEach(w=>w.scrollTop=w.dataset.v*44);
}
function sheet(t,ph,ok,val){
 const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="sheet"><h3>${t}</h3><input id="sf" placeholder="${ph}" value="${esc(val||"")}" style="margin-bottom:14px"><div class="seg"><button class="gb" data-x>Annulla</button><button class="gb on" data-ok>Salva</button></div></div>`;
 o.onclick=e=>{const b=e.target.closest("button");if(e.target===o||(b&&b.dataset.x!==undefined))o.remove();else if(b&&b.dataset.ok!==undefined){const v=$("#sf").value.trim();if(v){ok(v);o.remove()}}};
 document.body.appendChild(o);$("#sf").focus();
}
/* ---------- CHART ---------- */
function series(e,m){const d={};(e.logs||[]).forEach(x=>{const k=new Date(x.d).toDateString();d[k]=m==="k"?Math.max(d[k]||0,x.k):(d[k]||0)+x.r*x.k});return Object.keys(d).map(k=>({t:new Date(k),y:d[k]}))}
function chart(pts,u){
 if(!pts.length)return`<div class="ex">Nessun dato per questo esercizio</div>`;
 const W=340,H=190,p=30,ys=pts.map(q=>q.y),mx=Math.max(...ys),mn=u?Math.min(...ys)-1:Math.min(...ys,0),r=(mx-mn)||1,n=pts.length;
 const X=i=>n>1?p+i*(W-2*p)/(n-1):W/2,Y=y=>H-26-(y-mn)/r*(H-26-p);
 const L=pts.map((q,i)=>[X(i),Y(q.y)]),line=L.map(q=>q.join(",")).join(" ");
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)"/></linearGradient><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".4"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>
 ${[0,.5,1].map(f=>`<line x1="${p}" x2="${W-p}" y1="${Y(mn+f*r)}" y2="${Y(mn+f*r)}" stroke="var(--gbd)" stroke-dasharray="3 5"/><text x="${p-6}" y="${Y(mn+f*r)+3}" font-size="9" text-anchor="end" fill="var(--mu)">${Math.round(mn+f*r)}</text>`).join("")}
 ${n>1?`<polygon points="${L[0][0]},${H-26} ${line} ${L[n-1][0]},${H-26}" fill="url(#ag)"/><polyline points="${line}" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`:""}
 ${L.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="var(--bg)" stroke="var(--ac)" stroke-width="3"/>${n<9||i%2===0?`<text x="${q[0]}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--mu)">${fd(pts[i].t)}</text>`:""}`).join("")}</svg>`}
/* ---------- VIEWS ---------- */
function vTrain(){
 if(V.e){const e=E(),l=last(e),ls=e.logs||[],lx=ls[ls.length-1]||{r:10,k:20},ns=l&&new Date(l.d).toDateString()===new Date().toDateString()?l.s.length+1:1;
  return`<h1><button class="gb rd sm" data-a="back">${I("back")}</button><span>${esc(e.name)}</span></h1>
  <div class="g card" style="cursor:default"><div class="mu">Ultimo carico</div><div style="font-size:38px;font-weight:800;letter-spacing:-.02em">${l?Math.max(...l.s.map(x=>x.k))+" kg":"—"}</div><div class="mu">${l?l.s.map(x=>x.r+"×"+x.k).join(" · ")+" · "+fd(l.d):"Registra la tua prima serie"}</div></div>
  <h2>Nuova serie</h2><div class="g" style="padding:16px"><div class="fl"><div class="nr"><label>Serie</label><div class="step"><button class="gb sm" data-a="st" data-f="s" data-d="-1">${I("minus")}</button><input id="s" type="number" inputmode="numeric" value="${ns}"><button class="gb sm" data-a="st" data-f="s" data-d="1">${I("plus")}</button></div></div>
  <div class="nr"><label>Ripetizioni</label><div class="step"><button class="gb sm" data-a="st" data-f="r" data-d="-1">${I("minus")}</button><input id="r" type="number" inputmode="numeric" value="${lx.r}"><button class="gb sm" data-a="st" data-f="r" data-d="1">${I("plus")}</button></div></div>
  <div class="nr"><label>Carico (kg)</label><div class="step"><button class="gb sm" data-a="st" data-f="k" data-d="-2.5">${I("minus")}</button><input id="k" type="number" inputmode="decimal" value="${lx.k}"><button class="gb sm" data-a="st" data-f="k" data-d="2.5">${I("plus")}</button></div></div></div>
  <button class="gb on" data-a="log" style="width:100%;padding:14px">${I("check")} Salva serie</button></div>
  <h2>Storico</h2>${[...ls].reverse().slice(0,12).map(x=>`<div class="g item row"><span class="mu" style="width:56px">${fd(x.d)}</span><span class="sp"><b>${x.r} × ${x.k} kg</b> <span class="mu">serie ${x.s}</span></span><button class="gb sm" data-a="dlog" data-v="${x.d}">${I("x")}</button></div>`).join("")||`<div class="ex">Ancora nessuna serie</div>`}`}
 if(V.g){const g=G();return`<h1><button class="gb rd sm" data-a="back">${I("back")}</button><span>${esc(g.name)}</span><button class="gb sm" data-a="adde">${I("plus")}</button>${EM?`<button class="gb sm" data-a="eg" data-v="${g.id}">${I("palette")}</button>`:""}<button class="gb sm ${EM?"on":""}" data-a="em">${I(EM?"check":"edit")}</button></h1>
  ${g.ex.map(e=>{const l=last(e);return`<div class="g item row"><div class="sp" data-a="${EM?"rne":"ex"}" data-v="${e.id}" style="cursor:pointer"><b style="font-size:16px">${esc(e.name)}</b><div class="mu">${l?`Ultimo: ${Math.max(...l.s.map(x=>x.k))} kg · ${fd(l.d)}`:"Nessun dato"}</div></div>${EM?`<button class="gb sm" data-a="rne" data-v="${e.id}">${I("edit")}</button><button class="gb sm" data-a="dele" data-v="${e.id}">${I("trash")}</button>`:""}</div>`}).join("")||`<div class="ex">Nessun esercizio. Tocca + in alto per aggiungerne uno.</div>`}
  `}
 return`<h1><span>Allenamento</span><button class="gb sm" data-a="addg">${I("plus")}</button><button class="gb sm ${EM?"on":""}" data-a="em">${I(EM?"check":"edit")}</button></h1><div class="grid">${db.groups.map((g,i)=>`<div class="g card" data-a="${EM?"eg":"grp"}" data-v="${g.id}">${EM?`<button class="gb sm" data-a="dg" data-v="${g.id}" style="position:absolute;top:10px;right:10px">${I("trash")}</button>`:""}<div class="badge" style="background:${grad(gcol(g,i))}">${I("dumbbell")}</div><b style="font-size:17px">${esc(g.name)}</b><div class="mu">${EM?"Tocca per modificare":g.ex.length+" esercizi"}</div></div>`).join("")}</div>`}
function vTimer(){
 const r=rem(),st=T.run?"In corso":r<=0?"Finito":r<T.total?"In pausa":"Pronto";
 return`<h1><span>Timer</span></h1>
 <div class="rg"><svg viewBox="0 0 240 240"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)"/></linearGradient></defs><circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--gbd)" stroke-width="12"/><circle id="rc" cx="120" cy="120" r="${R}" fill="none" stroke="url(#tg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(T.total?r/T.total:0))}" style="transition:stroke-dashoffset .25s linear"/></svg><div class="rc"><b id="rt">${fmt(r)}</b><span class="mu">${st}</span></div></div>
 <div class="ctl"><button class="gb rd" data-a="reset">${I("reset")}</button><button class="gb on big" data-a="${T.run?"pause":"play"}">${I(T.run?"pause":"play")}</button><button class="gb rd" data-a="add" data-v="30"><b>+30</b></button></div>
 <h2>Tempi rapidi</h2><div class="pr">${db.timers.map(s=>`<button class="gb" data-a="start" data-v="${s}">${lbl(s)}</button>`).join("")}</div>
 <button class="gb" data-a="cust" style="width:100%">${I("clock")} Personalizzato</button>`}
function vProg(){
 const all=[];db.groups.forEach(g=>g.ex.forEach(e=>all.push({g,e})));
 if(!all.length)return`<h1><span>Progressioni</span></h1><div class="ex">Aggiungi un esercizio per iniziare</div>`;
 const cur=all.find(x=>x.e.id===PE)||all.find(x=>(x.e.logs||[]).length)||all[0],e=cur.e,ls=e.logs||[];
 const pts=series(e,db.metric),pr=ls.length?Math.max(...ls.map(x=>x.k)):0,vol=ls.reduce((a,x)=>a+x.r*x.k,0),ses=new Set(ls.map(x=>new Date(x.d).toDateString())).size,l=last(e);
 return`<h1><span>Progressioni</span></h1>
 <div class="chips">${all.map(x=>`<button class="gb ${x.e.id===e.id?"on":""}" data-a="pe" data-v="${x.e.id}">${esc(x.e.name)}</button>`).join("")}</div>
 <div class="seg" style="margin-bottom:12px"><button class="gb ${db.metric==="k"?"on":""}" data-a="met" data-v="k">Carico max</button><button class="gb ${db.metric==="v"?"on":""}" data-a="met" data-v="v">Volume</button></div>
 <div class="g" style="padding:14px 10px 6px"><div class="mu" style="margin:0 8px 6px">${db.metric==="k"?"Carico massimo (kg)":"Volume totale (kg × rip.)"} · ${esc(cur.g.name)}</div>${chart(pts)}</div>
 <h2>Statistiche</h2><div class="pr"><div class="g gb" style="border-radius:18px"><b>${pr?pr+" kg":"—"}</b><small>Record</small></div><div class="g gb" style="border-radius:18px"><b>${l?Math.max(...l.s.map(x=>x.k))+" kg":"—"}</b><small>Ultimo</small></div><div class="g gb" style="border-radius:18px"><b>${ses}</b><small>Sessioni</small></div></div>
 <div class="g item row"><span class="mu sp">Volume totale sollevato</span><b>${Math.round(vol).toLocaleString("it-IT")} kg</b></div>
 ${bwv()&&pr?`<div class="g item row"><span class="mu sp">Record / peso corporeo</span><b>${(pr/bwv()).toFixed(2)}×</b></div>`:""}`}
function vSet(){const P=db.prof,w=bwv(),bmi=P.h&&w?w/Math.pow(P.h/100,2):0;return`<h1><span>Profilo</span></h1>
 <h2>Misure corporee</h2><div class="g" style="padding:16px"><div class="f2"><div><label>Altezza (cm)</label><input id="ph" type="number" inputmode="numeric" value="${P.h||""}" placeholder="175"></div><div><label>Peso (kg)</label><input id="pw" type="number" inputmode="decimal" step="0.1" value="${w||""}" placeholder="70"></div></div><button class="gb on" data-a="prof" style="width:100%">${I("check")} Salva misure</button></div>
 <div class="pr" style="margin-top:12px"><div class="g gb" style="border-radius:18px"><b>${w?w+" kg":"—"}</b><small>Peso</small></div><div class="g gb" style="border-radius:18px"><b>${P.h?P.h+" cm":"—"}</b><small>Altezza</small></div><div class="g gb" style="border-radius:18px"><b>${bmi?bmi.toFixed(1):"—"}</b><small>BMI</small></div></div>
 ${P.w.length>1?`<div class="g" style="padding:14px 10px 6px;margin-bottom:6px"><div class="mu" style="margin:0 8px 6px">Andamento peso (kg)</div>${chart(P.w.map(x=>({t:new Date(x.d),y:x.v})),1)}</div>`:`<div class="mu" style="text-align:center">Salva il peso in giorni diversi per vedere l’andamento</div>`}
 <h1 style="margin-top:28px"><span>Impostazioni</span></h1>
 <h2>Colore app</h2><div class="sw8" style="justify-content:flex-start">${ACC.map((c,i)=>`<button class="sw ${(db.ac||0)===i?"sel":""}" data-a="acc" data-v="${i}" style="background:linear-gradient(135deg,${c[0]},${c[1]})"></button>`).join("")}</div>
 <h2>Tema</h2><div class="seg"><button class="gb ${db.theme==="dark"?"on":""}" data-a="th" data-v="dark">${I("moon")} Scuro</button><button class="gb ${db.theme==="light"?"on":""}" data-a="th" data-v="light">${I("sun")} Chiaro</button></div>
 <h2>Tempi rapidi predefiniti</h2>${db.timers.map((s,i)=>`<div class="g item row" data-a="tset" data-v="${i}" style="cursor:pointer">${I("clock")}<span class="sp">Preset ${i+1}</span><b>${lbl(s)}</b></div>`).join("")}
 <h2>Notifiche</h2><button class="gb" data-a="notif" style="width:100%">${I("bell")} Abilita notifiche e suono</button>
 <h2>Backup dati</h2><div class="g" style="padding:14px"><textarea id="bk" rows="4" placeholder="Il JSON appare qui. Incolla qui per importare."></textarea><div class="seg" style="margin-top:10px"><button class="gb" data-a="exp">${I("down")} Esporta</button><button class="gb on" data-a="imp">${I("up")} Importa</button></div><input id="fi" type="file" accept=".json,application/json" style="margin-top:10px;text-align:left"></div>`}
const TABS=[["train","dumbbell","Allena"],["timer","timer","Timer"],["prog","trend","Progressi"],["set","user","Profilo"]];
function render(keep){
 document.documentElement.dataset.theme=db.theme;{const A=ACC[db.ac||0],s=document.documentElement.style;s.setProperty("--ac",A[0]);s.setProperty("--ac2",A[1])}
 const m=$("#main");m.innerHTML={train:vTrain,timer:vTimer,prog:vProg,set:vSet}[tab]();
 if(!keep){m.style.animation="none";void m.offsetWidth;m.style.animation=""}
 $("#nav").innerHTML=TABS.map(t=>`<button class="${tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${I(t[1])}${t[2]}</button>`).join("");mini();
}
/* ---------- EVENTS ---------- */
document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v,g=G(),e=E();
 if(a==="tab"){tab=v;EM=0;if(v==="train")V={};render()}
 else if(a==="grp"){EM=0;V={g:v};render()}else if(a==="ex"){V={g:V.g,e:v};render()}
 else if(a==="back"){EM=0;V=V.e?{g:V.g}:{};render()}
 else if(a==="addg")gsheet(null);else if(a==="eg")gsheet(db.groups.find(x=>x.id===v));
 else if(a==="em"){EM=EM?0:1;render(true)}
 else if(a==="dg")del("Gruppo eliminato",()=>{db.groups=db.groups.filter(x=>x.id!==v)});
 else if(a==="acc"){db.ac=+v;save();render(true)}
 else if(a==="prof"){const h=+$("#ph").value,w=+$("#pw").value;if(h>0)db.prof.h=h;if(w>0){const L=db.prof.w[db.prof.w.length-1];if(L&&new Date(L.d).toDateString()===new Date().toDateString())L.v=w;else db.prof.w.push({d:Date.now(),v:w})}save();toast("Misure salvate");render(true)}
 else if(a==="delg")del("Gruppo eliminato",()=>{db.groups=db.groups.filter(x=>x.id!==V.g);V={}});
 else if(a==="adde")sheet("Nuovo esercizio","Nome esercizio",n=>{g.ex.push({id:uid(),name:n,logs:[]});save();render()});
 else if(a==="rne"){const x=g.ex.find(i=>i.id===v);sheet("Modifica esercizio","Nome",n=>{x.name=n;save();render()},x.name)}
 else if(a==="dele")del("Esercizio eliminato",()=>{g.ex=g.ex.filter(x=>x.id!==v)});
 else if(a==="st"){const i=$("#"+el.dataset.f);i.value=Math.max(0,+((+i.value)+(+el.dataset.d)).toFixed(1))}
 else if(a==="log"){const s=+$("#s").value,r=+$("#r").value,k=+$("#k").value;if(!r||k<0)return;e.logs.push({d:Date.now(),s,r,k});save();toast("Serie salvata");render(true)}
 else if(a==="dlog")del("Serie eliminata",()=>{e.logs=e.logs.filter(x=>x.d!==+v)});
 else if(a==="pe"){PE=v;render(true)}else if(a==="met"){db.metric=v;save();render(true)}
 else if(a==="th"){db.theme=v;save();render(true)}
 else if(a==="tset")picker("Preset "+(+v+1),db.timers[v],s=>{db.timers[v]=s;save();if(!T.run&&T.left===T.total&&v==0){T.total=T.left=s}render(true)});
 else if(a==="notif"){beep();try{Notification.requestPermission().then(p=>toast(p==="granted"?"Notifiche abilitate":"Notifiche non concesse"))}catch(x){toast("Notifiche non supportate qui")}}
 else if(a==="play")resume();else if(a==="pause")pause();else if(a==="reset")reset();
 else if(a==="start")start(+v);else if(a==="add")addT(+v);
 else if(a==="cust")picker("Timer personalizzato",T.total||60,s=>start(s));
 else if(a==="exp"){const j=JSON.stringify(db,null,1);$("#bk").value=j;try{const u=URL.createObjectURL(new Blob([j],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="gymer-backup.json";l.click()}catch(x){}}
 else if(a==="imp")imp($("#bk").value);
});
function imp(t){try{const d=JSON.parse(t);if(!Array.isArray(d.groups))throw 0;del("Dati importati",()=>{db=d;db.theme=db.theme||"dark";db.metric=db.metric||"k";db.prof=db.prof||{h:0,w:[]};if(!db.timers||db.timers.length!==3)db.timers=[60,90,180];V={}})}catch(e){toast("JSON non valido")}}
document.addEventListener("change",e=>{if(e.target.id==="fi"&&e.target.files[0]){const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(e.target.files[0])}});
render();
if("serviceWorker"in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
